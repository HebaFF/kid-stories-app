<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طيارة نور — حكايات مصرية</title>
<meta name="description" content="حكاية قصيرة بالمصري: نور ويوسف والطيارة الورق.">
<meta property="og:title" content="طيارة نور — حكايات مصرية">
<meta property="og:description" content="حكاية قصيرة بالمصري: نور ويوسف والطيارة الورق.">
<meta property="og:type" content="video.other">
<meta property="og:image" content="poster.jpg">
<link rel="icon" href="../favicon.ico">
<style>
  /* The press this magazine is printed on: vermilion ink owns the ground,
     paper appears only as plates laid on it. Same world as the app. */
  @font-face { font-family: Lalezar; src: url(Lalezar-Regular.ttf) format('truetype'); font-display: swap; }
  @font-face { font-family: Naskh;   src: url(NotoNaskhArabic.ttf) format('truetype'); font-display: swap; }

  :root {
    --ground:#C8321E; --ground-deep:#A82715;
    --plate:#F5ECD8; --ink:#17120F; --ink-muted:#6E5A48;
    --on-ground:#FBF3E2; --on-ground-muted:#FAE4D8;
    --rule:3.5px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#52150F; --ground-deep:#3A0D08;
      --plate:#463527; --ink:#F6ECD8; --ink-muted:#CBB694;
      --on-ground:#F7E4CE; --on-ground-muted:#E0C3B0;
    }
  }
  :root[data-theme="dark"] {
    --ground:#52150F; --ground-deep:#3A0D08;
    --plate:#463527; --ink:#F6ECD8; --ink-muted:#CBB694;
    --on-ground:#F7E4CE; --on-ground-muted:#E0C3B0;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--ground);
    /* halftone: the dot the whole world is printed through */
    background-image: radial-gradient(var(--ink) 0.9px, transparent 0.9px);
    background-size: 7px 7px;
    color: var(--on-ground);
    font-family: Naskh, serif;
    min-height: 100svh;
  }
  .band {
    background: var(--ground-deep);
    border-bottom: var(--rule) solid var(--ink);
    padding: 22px 16px 16px;
    text-align: center;
  }
  .masthead {
    font-family: Lalezar, cursive; font-weight: 400;
    font-size: clamp(34px, 9vw, 52px); line-height: 1.12;
    margin: 0; color: var(--on-ground);
  }
  .masthead-latin {
    font-family: Lalezar, cursive; letter-spacing: 2px;
    font-size: 12px; margin: 6px 0 0; color: var(--on-ground-muted);
    text-transform: uppercase; direction: ltr;
  }
  main { max-width: 900px; margin: 0 auto; padding: 18px 16px 44px; }

  .plate {
    background: var(--plate);
    border: var(--rule) solid var(--ink);
    box-shadow: 4px 4px 0 rgba(0,0,0,.28);
    padding: 0;
    overflow: hidden;
  }
  video { display:block; width:100%; height:auto; background:#000; }

  .caption {
    padding: 16px 18px 20px;
    border-top: 2px solid var(--ink);
    color: var(--ink);
  }
  h1 {
    font-family: Lalezar, cursive; font-weight:400;
    font-size: clamp(24px, 6.5vw, 34px); line-height:1.35; margin: 0 0 6px;
  }
  .meta { font-size: 13px; color: var(--ink-muted); margin: 0; }

  .moral {
    margin: 20px 0 0;
    background: var(--plate);
    border: var(--rule) solid var(--ink);
    box-shadow: 4px 4px 0 rgba(0,0,0,.28);
    padding: 18px;
    color: var(--ink);
  }
  .moral .label {
    font-family: Lalezar, cursive; font-size: 15px; letter-spacing:1px;
    display:inline-block; background: var(--ink); color: var(--plate);
    padding: 3px 10px; margin-bottom: 10px;
  }
  .moral p { margin: 0; font-size: clamp(19px, 5vw, 23px); line-height: 1.9; }

  .back {
    display:inline-block; margin-top: 22px; min-height: 46px;
    font-family: Lalezar, cursive; font-size: 17px; line-height: 46px;
    padding: 0 18px; color: var(--ink); background: var(--plate);
    border: 2px solid var(--ink); text-decoration: none;
    box-shadow: 3px 3px 0 rgba(0,0,0,.28);
  }
</style>
</head>
<body>
  <header class="band">
    <p class="masthead">حكايات مصرية</p>
    <p class="masthead-latin">Egyptian Stories</p>
  </header>

  <main>
    <div class="plate">
      <video controls playsinline preload="metadata" poster="poster.jpg">
        <source src="kite-story.mp4" type="video/mp4">
        متصفحك مش بيشغّل الفيديو. <a href="kite-story.mp4">نزّل الحكاية من هنا</a>.
      </video>
      <div class="caption">
        <h1>طيارة نور</h1>
        <p class="meta">دقيقة واحدة · بالمصري · من ٤ سنين</p>
      </div>
    </div>

    <section class="moral">
      <span class="label">الحكمة</span>
      <p>أحلى لما نتشارك ونفرح مع بعض.</p>
    </section>

    <a class="back" href="../">كل الحكايات ←</a>
  </main>
</body>
</html>
